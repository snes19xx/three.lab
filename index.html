<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>three.lab — City</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="./styles/lab.css" />
    <link rel="stylesheet" href="./styles/nav.css" />
    <link rel="stylesheet" href="./styles/city.css" />

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>

  <body>
    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      // Mirrors src/shared/theme.js, which takes over once modules load.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("mt-theme");
        } catch (e) {}
        var dark = saved
          ? saved === "dark"
          : !!(
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
            );
        document.body.classList.toggle("dark", dark);
      })();
    </script>
    <!-- TOP BAR -->
    <header id="top-bar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>three.Lab</span>
      </div>

      <!-- Primary navigation across the three tools -->
      <nav class="tool-nav">
        <span class="tool-nav-item active">City</span>
        <a class="tool-nav-item" href="./lab.html">Lab</a>
        <a class="tool-nav-item" href="./editor.html">Editor</a>
      </nav>

      <span class="bar-sep"></span>
      <span id="subject-name" class="placeholder">No area selected</span>

      <div class="top-actions">
        <span id="cursor-coords">— lat &nbsp; — lon</span>
        <button class="btn" id="btnLightMode">
          <span class="theme-glyph"></span>
          <span id="themeLabel">Light mode</span>
        </button>
      </div>
    </header>

    <!-- SIDE PANEL -->
    <aside id="panel">
      <div class="panel-inner">
        <!-- SEARCH -->
        <div class="section">
          <div class="section-title">
            Place
            <span class="hint">osm / nominatim</span>
          </div>
          <div class="search-wrap">
            <input
              type="text"
              id="searchInput"
              class="text-input"
              placeholder="Vancouver, Victoria Harbour…"
              autocomplete="off"
            />
            <button class="btn" id="btnSearch">Go</button>
          </div>
          <ul class="search-results" id="searchResults"></ul>
        </div>

        <!-- EXTENT -->
        <div class="section">
          <div class="section-title">
            Extent
            <span class="hint">centred on map</span>
          </div>
          <div class="ctrl-row">
            <span class="ctrl-label">Size</span>
            <input
              type="range"
              id="extentSize"
              min="200"
              max="4000"
              step="50"
              value="800"
            />
            <span class="ctrl-val" id="valExtentSize">800m</span>
          </div>
          <div class="ctrl-row">
            <span class="ctrl-label">Height ×</span>
            <input
              type="range"
              id="heightScale"
              min="0.25"
              max="4"
              step="0.05"
              value="1"
            />
            <span class="ctrl-val" id="valHeightScale">1.00</span>
          </div>
          <div class="ctrl-row">
            <span class="ctrl-label">Min footprint</span>
            <input
              type="range"
              id="minArea"
              min="0"
              max="500"
              step="10"
              value="0"
            />
            <span class="ctrl-val" id="valMinArea">off</span>
          </div>
          <div class="extent-readout" id="extentReadout">— km² · —</div>
        </div>

        <!-- LAYERS -->
        <div class="section">
          <div class="section-title">
            Layers
            <span class="hint">what to fetch</span>
          </div>
          <div id="layerList"></div>
          <div class="ctrl-sep"></div>
          <label class="check-row">
            <input type="checkbox" id="optGround" checked />
            <span>Ground plane</span>
          </label>
        </div>

        <div id="buildStats" class="empty"></div>
      </div>

      <!-- ACTION DOCK -->
      <div class="panel-footer action-dock">
        <div class="dock-progress" id="progressWrap">
          <div class="progress-bar"><span id="progressFill"></span></div>
          <div class="progress-label" id="progressLabel">Working…</div>
        </div>
        <div class="dock-buttons">
          <button class="btn" id="btnEstimate">Estimate</button>
          <button class="btn accent dock-primary" id="btnBuild">
            Build city
          </button>
          <button class="btn danger dock-primary" id="btnCancel" hidden>
            Cancel
          </button>
        </div>
        <span class="footer-note">
          Data © OpenStreetMap contributors, ODbL.
        </span>
      </div>
    </aside>

    <!-- MAP -->
    <div id="map"></div>
    <div class="map-crosshair" id="mapCrosshair"></div>

    <!-- WORKING OVERLAY -->
    <div class="work-overlay" id="workOverlay" hidden>
      <div class="work-card">
        <div class="work-phase" id="workPhase">Working</div>
        <div class="work-detail" id="workDetail">—</div>
        <div class="work-bar" id="workBarWrap"><span id="workFill"></span></div>
        <div class="work-meta">
          <span id="workElapsed">0s</span>
          <button class="btn danger" id="btnCancelOverlay">Cancel</button>
        </div>
      </div>
    </div>

    <!-- RESULT CARD -->
    <div class="result-card" id="resultCard" hidden>
      <button class="result-close" id="btnResultClose" title="Dismiss">
        ×
      </button>
      <div class="result-title" id="resultTitle">City built</div>
      <div class="result-grid" id="resultGrid"></div>
      <div class="result-actions">
        <button class="btn accent wide" id="btnToLab">Open in Lab →</button>
        <div class="result-row">
          <button class="btn" id="btnToEditor">Editor →</button>
          <button class="btn" id="btnDownload">Download .glb</button>
        </div>
      </div>
    </div>

    <div class="toast-wrap" id="toastWrap"></div>

    <script type="module" src="./src/city/main.js"></script>
  </body>
</html>
