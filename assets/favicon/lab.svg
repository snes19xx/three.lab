<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <mask id="toolsMask" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="white"/>

      <!-- ruler tick marks -->
      <g transform="rotate(-32 64 64)">
        <g stroke="black" stroke-width="1.6">
          <line x1="22" y1="86" x2="22" y2="94"/>
          <line x1="32" y1="86" x2="32" y2="91"/>
          <line x1="42" y1="86" x2="42" y2="94"/>
          <line x1="52" y1="86" x2="52" y2="91"/>
          <line x1="62" y1="86" x2="62" y2="94"/>
          <line x1="72" y1="86" x2="72" y2="91"/>
          <line x1="82" y1="86" x2="82" y2="94"/>
          <line x1="92" y1="86" x2="92" y2="91"/>
          <line x1="102" y1="86" x2="102" y2="94"/>
        </g>
      </g>

      <!-- protractor degree ticks + centre line/pivot -->
      <g stroke="black" stroke-width="1.6">
        <line x1="64" y1="38" x2="64" y2="45"/>
        <line x1="40.4" y1="45.4" x2="35.5" y2="40.5"/>
        <line x1="87.6" y1="45.4" x2="92.5" y2="40.5"/>
        <line x1="28.9" y1="61.4" x2="22.2" y2="59.3"/>
        <line x1="99.1" y1="61.4" x2="105.8" y2="59.3"/>
        <line x1="52" y1="39.6" x2="49.7" y2="33.3"/>
        <line x1="76" y1="39.6" x2="78.3" y2="33.3"/>
        <line x1="64" y1="76" x2="64" y2="42"/>
      </g>
      <circle cx="64" cy="78" r="2.6" fill="black"/>

      <!-- pencil tip nib -->
      <g transform="rotate(38 64 64)">
        <polygon points="104,62.4 108,64.5 104,66.6" fill="black"/>
      </g>
    </mask>
  </defs>

  <g fill="#496c51" mask="url(#toolsMask)">
    <!-- ruler -->
    <g transform="rotate(-32 64 64)">
      <rect x="14" y="86" width="100" height="16"/>
    </g>

    <!-- protractor -->
    <path d="M 24 78 A 40 40 0 0 1 104 78 Z"/>
    <rect x="20" y="76" width="88" height="4"/>

    <!-- pencil -->
    <g transform="rotate(38 64 64)">
      <rect x="-4" y="60" width="96" height="9" rx="1.5"/>
      <polygon points="92,60 108,64.5 92,69"/>
    </g>
  </g>
</svg>
